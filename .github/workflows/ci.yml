name: CI

on:
  push:
  pull_request:

jobs:
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libsqlite3-dev libssl-dev python3-numpy
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the desk app
        run: >
          xcodebuild test
          -project macos/Arthur/Arthur.xcodeproj
          -scheme Arthur
          -destination "platform=macOS"
          -derivedDataPath macos/Arthur/build
